[package]
name = "notepad"
version = "0.9.2"
edition = "2024"
description = "A simple notepad for Windows"
license = "MIT"
repository = "https://github.com/thomas3577/notepad"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
interprocess = "2.4.9"
rfd = "0.18.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
winresource = "0.1.34"
